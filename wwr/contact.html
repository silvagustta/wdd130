<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Black Water rafting</title>
    <meta name="description"
      content="contact us and schedule to visit our rafting and have fun summer trip in brazil.">
    <meta name="author" content="Gustavo Silva">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/logo.jpg" alt="Rafting Logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <div class="contact-title">
            <h1>Contact Us</h1>
        </div>

        <section class="company-info">
            <h2>Company Information</h2>

            <p>250 River Canyon Road</p>
            <p>Moab, Utah 84532</p>
            <p>+1 (435) 555-0123</p>
            <p>contact@blackwaterrafting.com</p>
        </section>

        <section class="contact-info">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d10488.090648830492!2d-109.58638995847232!3d38.599923878845445!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1spt-BR!2sbr!4v1785703978256!5m2!1spt-BR!2sbr"
                  width="300" height="250" style="border:0;" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
            <div class="contact-form">
                <form>
                    <div class="form-row">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>

                    <div class="form-row">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-row">
                        <span>Message Purpose</span>

                        <div class="radio-group">
                            <label><input type="radio" name="purpose"> General Inquiry</label>
                            <label><input type="radio" name="purpose"> Reservation Question</label>
                            <label><input type="radio" name="purpose"> Website Suggestion</label>
                        </div>
                    </div>

                    <div class="form-row">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" placeholder="Type Here..."></textarea>
                    </div>

                    <div class="newsletter">
                        <label>
                            <input type="checkbox" name="newsletter">
                            Please subscribe me to the monthly newsletter
                        </label>
                    </div>

                    <button type="submit">Get in Touch!</button>
                </form>
            </div>
        </section>

        <section class="employees">
            <h2>We Are Here to Serve You</h2>
            <div class="gallery">
                <figure>
                    <img src="images/emily.jpg" alt="Emily Reyes">
                    <figcaption>Emily Reyes<br>
                        Safety Instructor
                    </figcaption>
                </figure>
                <figure>
                    <img src="images/joseph.jpg" alt="Joseph Silva">
                    <figcaption>Joseph Silva<br>
                        River Guide
                    </figcaption>
                </figure>
                <figure>
                    <img src="images/peter.jpg" alt="Peter Smith">
                    <figcaption>Peter Smith<br>
                        River Guide
                    </figcaption>
                </figure>
            </div>
        </section>
    </main>

    <footer>
        <nav>
            <p>
                ©2026 White Water Rafting | Gustavo da Silva
            </p>
            <div class="socialmedia">
                <a href="https://facebook.com">
                    <img src="images/facebook.svg" alt="Facebook">
                </a>
                <a href="https://instagram.com">
                    <img src="images/instagram.svg" alt="Instagram">
                </a>
                <a href="https://x.com">
                    <img src="images/twitter.svg" alt="Twitter">
                </a>
            </div>
        </nav>
    </footer>
</body>

</html>
